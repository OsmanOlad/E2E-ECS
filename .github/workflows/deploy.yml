name: Deploy Infrastructure

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read  

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest flask boto3

      - name: Run Unit Tests
        env:
          TABLE_NAME: mock-table
          PYTHONPATH: ./application/src
        run: |
          pwd
          ls -f 
          pytest application/src/test_app.py
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::446781112519:role/github-actions-ecs-deploy-role
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: e2e-ecs-dev-repo
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./application
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  terraform:
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/envs/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::446781112519:role/github-actions-ecs-deploy-role
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan  

      - name: Terraform Apply
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: terraform apply -auto-approve


      - name: new image id in ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: url-shortener
          image: 446781112519.dkr.ecr.eu-west-2.amazonaws.com/e2e-ecs-dev-repo:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: e2e-ecs-dev-service
          cluster: e2e-ecs-dev-cluster
          codedeploy-appspec: appspec.yml
          codedeploy-application: e2e-ecs-dev-app
          codedeploy-deployment-group: e2e-ecs-dev-dg
          wait-for-service-stability: true
     
