name: Deploy Infrastructure

on:
  push:
    branches:
      - dev
      - staging
      - prod

permissions:
  id-token: write
  contents: read  

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest flask boto3

      - name: Run Unit Tests
        env:
          TABLE_NAME: mock-table
          PYTHONPATH: ./application/src
        run: |
          pytest application/src/test_app.py
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::446781112519:role/github-actions-ecs-deploy-role
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: e2e-ecs-${{ github.ref_name }}-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./application
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  terraform:
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/envs/${{ github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Replace ENVIRONMENT placeholder in Task Definition
        run: |
          sed -i "s/ENVIRONMENT/${{ github.ref_name }}/g" ../../../taskdef.json
          #just incase it breaks and i need to troubleshoot
          cat ../../../taskdef.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::446781112519:role/github-actions-ecs-deploy-role
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan  

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/prod') && github.event_name == 'push'
        run: terraform apply -auto-approve


      - name: new image id in ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ../../../taskdef.json
          container-name: url-shortener
          image: 446781112519.dkr.ecr.eu-west-2.amazonaws.com/e2e-ecs-${{ github.ref_name }}-repo:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: e2e-ecs-${{ github.ref_name }}-service
          cluster: e2e-ecs-${{ github.ref_name }}-cluster
          codedeploy-appspec: ../../../appspec.yml
          codedeploy-application: e2e-ecs-${{ github.ref_name }}-app
          codedeploy-deployment-group: e2e-ecs-${{ github.ref_name }}-dg
          wait-for-service-stability: true
    
